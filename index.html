<script>
(async () => {
  const LS = 'mirakinmap:k', box = document.getElementById('box');
  const lock = () => { box.className = 'box'; box.innerHTML = box.querySelector('img').outerHTML + '<p>このページは限定公開です。<br>共有されたリンクから開いてください。</p><div class="bar"></div>'; };
  const m = location.hash.match(/(?:^#|&)k=([A-Za-z0-9_-]+)/);
  let k = m ? m[1] : null;
  try { if (!k) k = localStorage.getItem(LS); } catch (e) {}
  if (!k || !window.crypto || !crypto.subtle || !window.DecompressionStream) return lock();
  try {
    const raw = Uint8Array.from(atob(document.getElementById('d').textContent), c => c.charCodeAt(0));
    const kb = Uint8Array.from(atob(k.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', kb, 'AES-GCM', false, ['decrypt']);
    const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, key, raw.slice(12));
    const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    try { localStorage.setItem(LS, k); } catch (e) {}
    if (m) history.replaceState(null, '', location.pathname + location.search);
    document.open(); document.write(html); document.close();
  } catch (e) { console.error('unlock failed', e); try { localStorage.removeItem(LS); } catch (_) {} lock(); }
})();
</script>
